<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Contract Document Sheet -->
  <g filter="url(#shadow)">
    <!-- Document Body with Folded Top Right -->
    <path
      d="M19 14 H37 L45 22 V48 C45 49.6569 43.6569 51 42 51 H19 C17.3431 51 16 49.6569 16 48 V17 C16 15.3431 17.3431 14 19 14 Z"
      fill="#ffffff"
    />
    <!-- Document Fold -->
    <path
      d="M37 14 V20 C37 21.1046 37.8954 22 39 22 H45 Z"
      fill="#cbd5e1"
    />
  </g>

  <!-- Document Clause Lines -->
  <rect x="21" y="26" width="16" height="2.5" rx="1.25" fill="#94a3b8" />
  <rect x="21" y="32" width="20" height="2.5" rx="1.25" fill="#cbd5e1" />
  <rect x="21" y="38" width="14" height="2.5" rx="1.25" fill="#cbd5e1" />

  <!-- Renewal / Obligation Active Check Badge -->
  <circle cx="44" cy="44" r="10" fill="#0284c7" />
  <circle cx="44" cy="44" r="9" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="1.5" />
  <!-- Checkmark -->
  <path
    d="M39.5 44 L42.5 47 L48.5 41"
    stroke="#38bdf8"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
